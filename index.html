<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đuổi hình bắt chữ – Mini game</title>
<style>
  :root { --blue:#1677d2; --navy:#12345a; --yellow:#ffd84d; --green:#16834a; --red:#c93434; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:Arial,Helvetica,sans-serif; background:transparent; color:#17324f; }
  .game { width:min(100%,1100px); margin:auto; padding:clamp(12px,2vw,24px); }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .counter,.score { background:#fff; border:2px solid #d6e8f8; border-radius:14px; padding:10px 16px; font-weight:800; }
  .counter { color:var(--navy); } .score { color:#8a5b00; background:#fff8d9; border-color:#ffe28a; }
  .prompt { background:#fff; border:3px solid #d6e8f8; border-radius:22px; padding:clamp(12px,2vw,22px); text-align:center; min-height:260px; display:flex; align-items:center; justify-content:center; }
  .prompt img { max-width:100%; max-height:390px; object-fit:contain; border-radius:14px; display:block; }
  .placeholder { font-size:clamp(58px,10vw,110px); line-height:1.25; }
  .placeholder small { display:block; font-size:15px; color:#66809b; font-weight:600; margin-top:10px; }
  .answer-row { display:flex; gap:10px; margin:16px 0 10px; }
  input { flex:1; min-width:0; border:2px solid #b8d5ef; border-radius:14px; padding:15px 16px; font-size:18px; outline:none; }
  input:focus { border-color:var(--blue); box-shadow:0 0 0 3px #1677d222; }
  button { border:0; border-radius:14px; padding:13px 19px; font-size:15px; font-weight:800; cursor:pointer; transition:transform .12s,filter .12s; }
  button:hover { filter:brightness(.96); transform:translateY(-1px); }
  button:disabled { opacity:.45; cursor:not-allowed; transform:none; }
  .primary { background:var(--blue); color:white; }
  .secondary { background:#e8f3fc; color:#14558f; }
  .skip { background:#fff0d2; color:#875600; }
  .actions { display:flex; flex-wrap:wrap; gap:10px; }
  .feedback { min-height:34px; margin:10px 2px 14px; font-size:18px; font-weight:900; }
  .feedback.good { color:var(--green); } .feedback.bad { color:var(--red); }
  .hint { display:none; padding:12px 15px; border-radius:12px; background:#fff8d9; color:#765000; margin:8px 0 14px; font-weight:700; }
  .end { display:none; text-align:center; padding:32px 15px; background:#fff; border:3px solid #d6e8f8; border-radius:22px; }
  .end h2 { color:var(--green); font-size:clamp(25px,4vw,40px); margin:0 0 12px; }
  .end .final-score { font-size:clamp(30px,5vw,48px); font-weight:900; color:#8a5b00; margin:14px; }
  @media(max-width:560px) { .answer-row { flex-direction:column; } .answer-row button { width:100%; } .prompt { min-height:210px; } }
</style>
</head>
<body>
<div class="game">
  <div class="top" id="statusBar">
    <div class="counter" id="counter">CÂU 1 / 3</div>
    <div class="score" id="score">⭐ ĐIỂM: 0</div>
  </div>

  <section id="playArea">
    <div class="prompt" id="prompt"></div>
    <div class="answer-row">
      <input id="answer" type="text" placeholder="Nhập đáp án của bạn..." autocomplete="off">
      <button class="primary" id="submitBtn">TRẢ LỜI</button>
    </div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="hint" id="hint"></div>
    <div class="actions">
      <button class="secondary" id="hintBtn">💡 GỢI Ý</button>
      <button class="primary" id="nextBtn" disabled>CÂU TIẾP THEO →</button>
      <button class="skip" id="skipBtn">BỎ QUA</button>
    </div>
  </section>

  <section class="end" id="endScreen">
    <h2>HOÀN THÀNH THỬ THÁCH!</h2>
    <div>Tổng điểm của đội bạn</div>
    <div class="final-score" id="finalScore">0 / 30</div>
    <button class="primary" id="restartBtn">CHƠI LẠI</button>
  </section>
</div>

<script>
/*
  CHỈNH SỬA CÂU HỎI TẠI ĐÂY:
  - image: dán URL ảnh đã tải lên internet (ví dụ ảnh trong GitHub repository).
  - emoji: hình tạm nếu chưa có URL ảnh.
  - answer: đáp án chính.
  - acceptedAnswers: các cách viết khác được chấp nhận.
  - hint: gợi ý sẽ hiện khi bấm GỢI Ý.
*/
const QUESTIONS = [
  {
    image: "",
    emoji: "🌐📡",
    answer: "truyền thông",
    acceptedAnswers: ["truyền thông"],
    hint: "Hai từ chỉ hoạt động trao đổi và lan tỏa thông tin."
  },
  {
    image: "",
    emoji: "📰🌍",
    answer: "tin quốc tế",
    acceptedAnswers: ["tin quốc tế", "thời sự quốc tế"],
    hint: "Thông tin, sự kiện diễn ra ở nhiều quốc gia."
  },
  {
    image: "",
    emoji: "🤝🌏",
    answer: "giao lưu quốc tế",
    acceptedAnswers: ["giao lưu quốc tế", "hợp tác quốc tế"],
    hint: "Sự kết nối, trao đổi giữa các quốc gia hoặc cộng đồng."
  }
];

let current = 0;
let score = 0;
let solved = false;
let hintShown = false;

const $ = id => document.getElementById(id);
const normalize = value => value.toLocaleLowerCase("vi").normalize("NFC").trim().replace(/\s+/g, " ");

function renderQuestion() {
  const q = QUESTIONS[current];
  $("counter").textContent = `CÂU ${current + 1} / ${QUESTIONS.length}`;
  $("score").textContent = `⭐ ĐIỂM: ${score}`;
  $("answer").value = "";
  $("answer").disabled = false;
  $("feedback").textContent = "";
  $("feedback").className = "feedback";
  $("hint").style.display = "none";
  $("hint").textContent = "";
  $("nextBtn").disabled = true;
  $("submitBtn").disabled = false;
  $("hintBtn").disabled = false;
  $("skipBtn").disabled = false;
  solved = false;
  hintShown = false;

  const prompt = $("prompt");
  prompt.innerHTML = "";
  if (q.image) {
    const img = document.createElement("img");
    img.src = q.image;
    img.alt = "Hình ảnh gợi ý câu " + (current + 1);
    img.onerror = () => { prompt.innerHTML = `<div class="placeholder">${q.emoji || "🖼️"}<small>Không tải được ảnh. Hãy kiểm tra đường dẫn trong QUESTIONS.</small></div>`; };
    prompt.appendChild(img);
  } else {
    const div = document.createElement("div");
    div.className = "placeholder";
    div.textContent = q.emoji || "🖼️";
    prompt.appendChild(div);
  }
  $("answer").focus();
}

function checkAnswer() {
  if (solved) return;
  const entered = normalize($("answer").value);
  if (!entered) {
    $("feedback").textContent = "HÃY NHẬP ĐÁP ÁN TRƯỚC NHÉ!";
    $("feedback").className = "feedback bad";
    return;
  }
  const q = QUESTIONS[current];
  const accepted = [q.answer, ...(q.acceptedAnswers || [])].map(normalize);
  if (accepted.includes(entered)) {
    solved = true;
    score += 10;
    $("score").textContent = `⭐ ĐIỂM: ${score}`;
    $("feedback").textContent = "CHÍNH XÁC! CHÚC MỪNG BẠN!";
    $("feedback").className = "feedback good";
    $("nextBtn").disabled = false;
    $("submitBtn").disabled = true;
    $("answer").disabled = true;
    $("hintBtn").disabled = true;
    $("skipBtn").disabled = true;
  } else {
    $("feedback").textContent = "CHƯA CHÍNH XÁC! HÃY THỬ LẠI!";
    $("feedback").className = "feedback bad";
    $("answer").select();
  }
}

function nextQuestion() {
  if (!solved) return;
  current++;
  if (current >= QUESTIONS.length) showEnd();
  else renderQuestion();
}

function skipQuestion() {
  current++;
  if (current >= QUESTIONS.length) showEnd();
  else renderQuestion();
}

function showEnd() {
  $("playArea").style.display = "none";
  $("statusBar").style.display = "none";
  $("endScreen").style.display = "block";
  $("finalScore").textContent = `${score} / ${QUESTIONS.length * 10}`;
}

function restart() {
  current = 0; score = 0; solved = false;
  $("playArea").style.display = "block";
  $("statusBar").style.display = "flex";
  $("endScreen").style.display = "none";
  renderQuestion();
}

$("submitBtn").addEventListener("click", checkAnswer);
$("answer").addEventListener("keydown", e => { if (e.key === "Enter") checkAnswer(); });
$("nextBtn").addEventListener("click", nextQuestion);
$("skipBtn").addEventListener("click", skipQuestion);
$("hintBtn").addEventListener("click", () => {
  if (hintShown || solved) return;
  $("hint").textContent = "GỢI Ý: " + QUESTIONS[current].hint;
  $("hint").style.display = "block";
  hintShown = true;
});
$("restartBtn").addEventListener("click", restart);

renderQuestion();
</script>
</body>
</html>
